<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Painel — Matheus Souza Imóveis SP</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<style>
  :root {
    --ground: #100d08; --surface: #1b160d; --surface-2: #241d12; --card: #1f1a10;
    --ink: #f4eedd; --ink-soft: #b7ac90; --ink-faint: #8a8064;
    --accent: #ffc61a; --accent-ink: #17120a; --clay: #e67a3e;
    --ring: rgba(244, 238, 221, 0.12); --ring-strong: rgba(244, 238, 221, 0.24);
    --font-display: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    --font-ui: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Consolas", "Menlo", "Liberation Mono", monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font-ui); line-height: 1.5; }
  h1, h2, .display { font-family: var(--font-display); text-transform: uppercase; letter-spacing: -0.01em; margin: 0; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 80px; }
  a { color: var(--accent); }

  .login-wrap { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-wrap[hidden] { display: none; }
  .login-card { background: var(--surface); border: 1px solid var(--ring-strong); border-radius: 12px; padding: 32px 28px; width: 100%; max-width: 360px; }
  .login-card h1 { font-size: 1.3rem; margin-bottom: 6px; }
  .login-card p { color: var(--ink-soft); font-size: 0.85rem; margin: 0 0 20px; }
  .login-card input { width: 100%; font-family: var(--font-ui); font-size: 0.95rem; padding: 12px 14px; border-radius: 8px; border: 1.5px solid var(--ring-strong); background: var(--surface-2); color: var(--ink); margin-bottom: 12px; }
  .login-card button { width: 100%; font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.02em; font-size: 0.88rem; padding: 13px; border-radius: 8px; border: none; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  .login-error { color: var(--clay); font-size: 0.82rem; margin-top: 10px; min-height: 1em; }

  header.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  header.top h1 { font-size: 1.3rem; }
  header.top .logout { font-family: var(--font-mono); font-size: 0.75rem; color: var(--ink-faint); cursor: pointer; border: 1px solid var(--ring-strong); border-radius: 100px; padding: 8px 14px; background: none; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .stat-card { background: var(--card); border: 1px solid var(--ring); border-radius: 12px; padding: 16px; }
  .stat-card .n { font-family: var(--font-mono); font-size: 1.8rem; color: var(--accent); font-variant-numeric: tabular-nums; }
  .stat-card .l { font-family: var(--font-mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); margin-top: 4px; }

  .funnel { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 32px; }
  .funnel-step { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 12px 16px; flex: 1; min-width: 130px; }
  .funnel-step .n { font-family: var(--font-mono); font-size: 1.3rem; }
  .funnel-step .l { font-family: var(--font-mono); font-size: 0.66rem; color: var(--ink-faint); text-transform: uppercase; margin-top: 2px; }

  h2.section { font-size: 1.05rem; margin: 32px 0 14px; display: flex; align-items: center; gap: 10px; }
  h2.section::before { content: ""; width: 18px; height: 2px; background: var(--accent); }

  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  thead th { text-align: left; font-family: var(--font-mono); font-size: 0.66rem; text-transform: uppercase; color: var(--ink-faint); padding: 8px 10px; border-bottom: 1px solid var(--ring-strong); }
  tbody td { padding: 10px 10px; border-bottom: 1px solid var(--ring); vertical-align: middle; }
  tbody tr:hover { background: var(--surface); }
  .table-wrap { overflow-x: auto; border: 1px solid var(--ring); border-radius: 10px; }
  select.status {
    font-family: var(--font-mono); font-size: 0.75rem; background: var(--surface-2); color: var(--ink);
    border: 1px solid var(--ring-strong); border-radius: 100px; padding: 5px 10px;
  }
  .wa-link { font-family: var(--font-mono); font-size: 0.78rem; white-space: nowrap; }
  .empty { color: var(--ink-faint); font-size: 0.85rem; padding: 20px; text-align: center; }
</style>
</head>
<body>

<div class="login-wrap" id="login-screen">
  <div class="login-card">
    <h1>Painel — Matheus Souza Imóveis SP</h1>
    <p>Acesso restrito. Faça login pra ver leads e funil.</p>
    <input type="email" id="login-email" placeholder="E-mail" autocomplete="username" />
    <input type="password" id="login-pass" placeholder="Senha" autocomplete="current-password" />
    <button id="login-btn">Entrar</button>
    <div class="login-error" id="login-error"></div>
    <div id="diag" style="margin-top:18px;padding-top:14px;border-top:1px dashed var(--ring);font-family:var(--font-mono);font-size:0.68rem;color:var(--ink-faint);line-height:1.7;white-space:pre-wrap;"></div>
  </div>
</div>

<div class="wrap" id="dashboard" hidden>
  <header class="top">
    <h1>Painel de leads</h1>
    <button class="logout" id="logout-btn">Sair</button>
  </header>

  <div class="stat-grid" id="stat-grid"></div>

  <h2 class="section">Funil (últimos 30 dias)</h2>
  <div class="funnel" id="funnel"></div>

  <h2 class="section">Leads recentes</h2>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Nome</th><th>WhatsApp</th><th>Empreendimento</th><th>Faixa</th><th>Origem</th><th>Status</th><th>Quando</th></tr>
      </thead>
      <tbody id="leads-body"></tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  // Log de diagnóstico visível na própria tela — pra dar pra mandar print e eu saber
  // exatamente onde travou, sem precisar abrir o console do navegador.
  function diag(msg) {
    var box = document.getElementById("diag");
    if (!box) return;
    var hora = new Date().toLocaleTimeString("pt-BR");
    box.textContent += "[" + hora + "] " + msg + "\n";
  }
  diag("Página carregada. Navegador: " + navigator.userAgent.slice(0, 60));

  // Se algo quebrar ANTES do try/catch de baixo pegar (ex: a lib do CDN não carregou),
  // isso aqui garante que aparece um aviso na tela em vez de a página ficar muda e o
  // botão de entrar não fazer nada — foi exatamente esse tipo de falha silenciosa que
  // causou o bug anterior do app principal.
  window.addEventListener("error", function (e) {
    diag("ERRO JS: " + e.message + " (" + (e.filename || "?").split("/").pop() + ":" + e.lineno + ")");
    var box = document.getElementById("login-error");
    if (box && !box.textContent) box.textContent = "Erro ao carregar o painel: " + e.message;
  });
</script>
<script>
  diag("Biblioteca Supabase (CDN): " + (typeof supabase === "undefined" ? "NÃO CARREGOU" : "carregada OK"));
  if (typeof supabase === "undefined") {
    document.getElementById("login-error").textContent = "Não consegui carregar a biblioteca do Supabase (CDN). Verifica sua internet e recarrega a página.";
  }
</script>
<script>
  const SUPABASE_URL = "https://jbtnywgozszrhhzvwmob.supabase.co";
  // Chave JWT (anon) em vez da publishable nova — formato mais antigo e mais testado
  // pelo SDK do supabase-js, pra eliminar qualquer incompatibilidade de versão.
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpidG55d2dvenN6cmhoenZ3bW9iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNTEyMjQsImV4cCI6MjEwNDYyNzIyNH0.x5yKL65BPgf3xH8-q4wHhjwq7S-xicNHsnGaspqCBzQ";
  let sb;
  try {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    diag("Cliente Supabase criado OK.");
  } catch (e) {
    diag("ERRO ao criar cliente Supabase: " + e.message);
  }

  const STATUS_OPTIONS = ["novo", "qualificado", "visita_agendada", "proposta", "fechado", "perdido"];
  const FUNNEL_STEPS = [
    { tipo: "view_home", label: "Abriu o app" },
    { tipo: "view_catalogo", label: "Viu o catálogo" },
    { tipo: "view_card", label: "Abriu um empreendimento" },
    { tipo: "usa_simulador", label: "Usou o simulador" },
  ];

  function money(n) { return (n || 0).toLocaleString("pt-BR"); }
  function waLink(phone, nome) { return `https://wa.me/${String(phone || "").replace(/\D/g, "")}?text=${encodeURIComponent(`Oi ${nome || ""}, aqui é o Matheus!`)}`; }

  async function loadDashboard() {
    const since = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString();

    const [leadsRes, eventosRes] = await Promise.all([
      sb.from("leads").select("*").order("created_at", { ascending: false }).limit(100),
      sb.from("eventos").select("tipo, session_id").gte("created_at", since),
    ]);

    const leads = leadsRes.data || [];
    const eventos = eventosRes.data || [];

    // --- stats ---
    const totalLeads = leads.length;
    const hoje = new Date().toDateString();
    const leadsHoje = leads.filter((l) => new Date(l.created_at).toDateString() === hoje).length;
    const fechados = leads.filter((l) => l.status === "fechado").length;
    document.getElementById("stat-grid").innerHTML = `
      <div class="stat-card"><div class="n">${money(totalLeads)}</div><div class="l">Leads no total</div></div>
      <div class="stat-card"><div class="n">${money(leadsHoje)}</div><div class="l">Leads hoje</div></div>
      <div class="stat-card"><div class="n">${money(fechados)}</div><div class="l">Fechados</div></div>
    `;

    // --- funil: sessões únicas por etapa ---
    const funnelEl = document.getElementById("funnel");
    funnelEl.innerHTML = FUNNEL_STEPS.map((step) => {
      const uniqueSessions = new Set(eventos.filter((e) => e.tipo === step.tipo).map((e) => e.session_id)).size;
      return `<div class="funnel-step"><div class="n">${money(uniqueSessions)}</div><div class="l">${step.label}</div></div>`;
    }).join("") + `<div class="funnel-step"><div class="n">${money(totalLeads)}</div><div class="l">Virou lead</div></div>`;

    // --- tabela de leads ---
    const tbody = document.getElementById("leads-body");
    if (!leads.length) {
      tbody.innerHTML = `<tr><td colspan="7"><div class="empty">Nenhum lead ainda — assim que alguém preencher o formulário do app, aparece aqui.</div></td></tr>`;
      return;
    }
    tbody.innerHTML = leads.map((l) => `
      <tr data-id="${l.id}">
        <td>${l.nome || "—"}</td>
        <td class="wa-link"><a href="${waLink(l.whatsapp, l.nome)}" target="_blank" rel="noopener">${l.whatsapp || "—"}</a></td>
        <td>${l.empreendimento_nome || "—"}</td>
        <td>${l.faixa_calculada || "—"}</td>
        <td>${l.origem || "—"}</td>
        <td>
          <select class="status" data-id="${l.id}">
            ${STATUS_OPTIONS.map((s) => `<option value="${s}" ${s === l.status ? "selected" : ""}>${s}</option>`).join("")}
          </select>
        </td>
        <td>${new Date(l.created_at).toLocaleDateString("pt-BR")}</td>
      </tr>
    `).join("");

    tbody.querySelectorAll("select.status").forEach((sel) => {
      sel.addEventListener("change", async () => {
        await sb.from("leads").update({ status: sel.value }).eq("id", sel.dataset.id);
      });
    });
  }

  function showDashboard() {
    document.getElementById("login-screen").hidden = true;
    document.getElementById("dashboard").hidden = false;
    loadDashboard();
  }

  document.getElementById("login-btn").addEventListener("click", async () => {
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-pass").value;
    const errorEl = document.getElementById("login-error");
    const btn = document.getElementById("login-btn");
    errorEl.textContent = "";
    btn.disabled = true;
    btn.textContent = "Entrando…";
    diag("Clicou em Entrar. E-mail: " + email + " | senha tem " + password.length + " caracteres.");
    if (!sb) { diag("PAROU: cliente Supabase (sb) não existe."); errorEl.textContent = "Painel não inicializou direito. Recarrega a página."; btn.disabled = false; btn.textContent = "Entrar"; return; }
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        diag("Supabase retornou ERRO: \"" + error.message + "\" (status " + (error.status || "?") + ", code " + (error.code || "?") + ")");
        errorEl.textContent = error.message || "E-mail ou senha errados.";
        return;
      }
      diag("Login OK! Sessão criada para: " + (data?.user?.email || "?"));
      showDashboard();
    } catch (err) {
      diag("EXCEÇÃO ao logar: " + (err?.message || String(err)));
      errorEl.textContent = "Falha de conexão: " + (err?.message || String(err));
    } finally {
      btn.disabled = false;
      btn.textContent = "Entrar";
    }
  });
  document.getElementById("login-pass").addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("login-btn").click(); });

  document.getElementById("logout-btn").addEventListener("click", async () => {
    await sb.auth.signOut();
    location.reload();
  });

  sb.auth.getSession().then(({ data }) => { if (data.session) showDashboard(); });
</script>
</body>
</html>
